version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "custom/dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:17"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "custom/dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:37"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
